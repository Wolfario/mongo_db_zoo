version: '3.1'
services:
  
  mongo1:
    image: mongo
    container_name: mongo1
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - 27017:27017
    volumes:
      - ./data/data1:/data/db
    networks:
      mongoCluster:
        aliases:
          - mongo1

  mongo2:
    image: mongo
    container_name: mongo2
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - 27018:27017
    volumes:
      - ./data/data2:/data/db
    networks:
      mongoCluster:
        aliases:
          - mongo2

  mongo3:
    image: mongo
    container_name: mongo3
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - 27019:27017
    volumes:
      - ./data/data3:/data/db
    networks:
      mongoCluster:
        aliases:
          - mongo3

networks:
  mongoCluster:
    driver: bridge